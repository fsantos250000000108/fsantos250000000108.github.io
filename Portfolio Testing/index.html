<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolio Testing</title>
        <style>
            /* Enable Smooth Scrolling for Anchor Links */
            html {
                scroll-behavior: smooth;
            }

            /* 1. Brutalist Background & Stark Typography */
            body {
                background-image: url("bg.webp");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                margin: 0;
                min-height: 100vh;
                font-family: "Courier New", Courier, monospace, sans-serif;
                color: #ffffff;
                background-color: #000000;
            }

            /* Brutalist Main Container */
            .container {
                background-color: #121212;
                max-width: 900px;
                margin: 50px auto;
                padding: 40px;
                border: 4px solid #ffffff;
                box-shadow: 10px 10px 0px #ffffff;
                border-radius: 0px; /* Rigid sharp corners */
            }

            h1 {
                font-family: "Arial Black", Impact, sans-serif;
                text-transform: uppercase;
                font-size: 2.6rem;
                letter-spacing: -1px;
                margin-top: 0;
                color: #ffffff;
            }

            h2 {
                font-family: "Arial Black", Impact, sans-serif;
                text-transform: uppercase;
                font-size: 1.8rem;
                letter-spacing: -1px;
                border-bottom: 4px solid #ffffff;
                padding-bottom: 8px;
                margin-top: 0;
            }

            p {
                font-size: 1.05rem;
                line-height: 1.5;
            }

            /* 2. Brutalist Buttons (Bold colors, sharp offset drop-shadow) */
            .btn {
                display: inline-block;
                padding: 12px 24px;
                margin: 10px 10px 10px 0;
                background-color: #0055ff;
                color: #ffffff;
                text-decoration: none;
                font-weight: 900;
                text-transform: uppercase;
                font-family: "Arial Black", sans-serif;
                letter-spacing: 1px;
                border: 3px solid #ffffff;
                box-shadow: 5px 5px 0px #ffffff;
                transition: all 0.1s ease-in-out;
                border-radius: 0px;
            }

            .btn:hover {
                background-color: #ffffff;
                color: #000000;
                box-shadow: 8px 8px 0px #0055ff;
                transform: translate(-3px, -3px);
            }

            .btn:active {
                transform: translate(2px, 2px);
                box-shadow: 2px 2px 0px #0055ff;
            }

            .btn-secondary {
                background-color: #ff0055;
            }

            .btn-secondary:hover {
                background-color: #ffffff;
                color: #000000;
                box-shadow: 8px 8px 0px #ff0055;
            }

            /* Solid Divider */
            hr {
                margin: 40px 0;
                border: 0;
                border-top: 4px solid #ffffff;
            }

            /* 3. Brutalist Gallery Layout */
            .achievement-gallery {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 25px;
                margin-top: 25px;
            }

            .card {
                background: #1e1e1e;
                padding: 20px;
                border: 3px solid #ffffff;
                box-shadow: 6px 6px 0px #ffffff;
                border-radius: 0px;
                transition:
                    transform 0.1s ease,
                    box-shadow 0.1s ease;
            }

            .card:hover {
                transform: translate(-3px, -3px);
                box-shadow: 9px 9px 0px #0055ff;
            }

            .card img {
                width: 100%;
                height: 180px;
                object-fit: cover;
                border: 2px solid #ffffff;
                border-radius: 0px;
                cursor: pointer;
            }

            .card h3 {
                font-family: "Arial Black", sans-serif;
                text-transform: uppercase;
                margin-top: 15px;
                margin-bottom: 5px;
            }

            /* Brutalist Lightbox Modal */
            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.95);
                justify-content: center;
                align-items: center;
            }

            .modal img {
                max-width: 85%;
                max-height: 80vh;
                border: 4px solid #ffffff;
                box-shadow: 10px 10px 0px #ff0055;
                border-radius: 0px;
            }

            .modal-close {
                position: absolute;
                top: 20px;
                right: 30px;
                font-size: 45px;
                font-weight: bold;
                color: #ffffff;
                cursor: pointer;
                font-family: "Arial Black", sans-serif;
            }

            .modal-close:hover {
                color: #ff0055;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Welcome to My Portfolio</h1>
            <p>Explore my projects and accomplishments below.</p>

            <!-- Functional Brutalist Buttons -->
            <a href="#achievements" class="btn">View Achievements</a>
            <a
                href="https://github.com/fsantos250000000108"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-secondary"
                >Visit GitHub</a
            >

            <hr />

            <!-- Achievement Section -->
            <section id="achievements">
                <h2>Achievements</h2>
                <div class="achievement-gallery">
                    <div class="card">
                        <img
                            src="cert1.png"
                            alt="Achievement 1"
                            onclick="openLightbox(this.src)"
                        />
                        <h3>Achievement Title 1</h3>
                        <p>Short description of what was accomplished.</p>
                    </div>
                    <div class="card">
                        <img
                            src="cert2.png"
                            alt="Achievement 2"
                            onclick="openLightbox(this.src)"
                        />
                        <h3>Achievement Title 2</h3>
                        <p>Short description of what was accomplished.</p>
                    </div>
                </div>
            </section>
        </div>

        <!-- Lightbox Modal for Full Image View -->
        <div id="lightboxModal" class="modal" onclick="closeLightbox()">
            <span class="modal-close">&times;</span>
            <img id="modalImage" src="" alt="Enlarged Achievement" />
        </div>

        <script>
            function openLightbox(imageSrc) {
                const modal = document.getElementById("lightboxModal");
                const modalImg = document.getElementById("modalImage");
                modal.style.display = "flex";
                modalImg.src = imageSrc;
            }

            function closeLightbox() {
                document.getElementById("lightboxModal").style.display = "none";
            }
        </script>
    </body>
</html>
